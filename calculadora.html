<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculadora</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: rgba(255, 255, 255, 0.06);
        --panel-2: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.55);
        --accent: #7c3aed;
        --accent-2: #22c55e;
        --danger: #ef4444;
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        --radius: 20px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
        color: var(--text);
        background:
          radial-gradient(900px 500px at 10% 10%, rgba(124, 58, 237, 0.28), transparent 60%),
          radial-gradient(800px 500px at 90% 20%, rgba(34, 197, 94, 0.18), transparent 55%),
          radial-gradient(700px 600px at 40% 100%, rgba(59, 130, 246, 0.18), transparent 60%),
          var(--bg);
      }

      .app {
        width: min(420px, 100%);
        border-radius: calc(var(--radius) + 8px);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.04));
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 18px;
        backdrop-filter: blur(10px);
      }

      .top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        padding: 4px 4px 8px;
      }

      .title {
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .badge {
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--muted);
      }

      .display {
        border-radius: var(--radius);
        padding: 16px 16px 14px;
        background: rgba(10, 14, 28, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.10);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        margin-bottom: 14px;
      }

      .display .expr {
        min-height: 18px;
        font-size: 13px;
        color: var(--muted);
        text-align: right;
        letter-spacing: 0.02em;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .display .value {
        margin-top: 6px;
        font-size: 44px;
        font-weight: 650;
        line-height: 1.1;
        text-align: right;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.10);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border-radius: 16px;
        padding: 16px 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow:
          0 8px 20px rgba(0, 0, 0, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        transition: transform 0.06s ease, background 0.15s ease, border-color 0.15s ease;
        user-select: none;
      }

      .btn:active { transform: translateY(1px); }
      .btn:hover { background: rgba(255, 255, 255, 0.085); border-color: rgba(255, 255, 255, 0.16); }
      .btn:focus-visible { outline: 2px solid rgba(124, 58, 237, 0.65); outline-offset: 2px; }

      .btn--op { background: rgba(124, 58, 237, 0.16); border-color: rgba(124, 58, 237, 0.35); }
      .btn--op:hover { background: rgba(124, 58, 237, 0.22); border-color: rgba(124, 58, 237, 0.45); }

      .btn--eq { background: rgba(34, 197, 94, 0.18); border-color: rgba(34, 197, 94, 0.40); }
      .btn--eq:hover { background: rgba(34, 197, 94, 0.24); border-color: rgba(34, 197, 94, 0.55); }

      .btn--danger { background: rgba(239, 68, 68, 0.18); border-color: rgba(239, 68, 68, 0.40); }
      .btn--danger:hover { background: rgba(239, 68, 68, 0.24); border-color: rgba(239, 68, 68, 0.55); }

      .span-2 { grid-column: span 2; }

      @media (prefers-reduced-motion: reduce) {
        .btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="app" aria-label="Calculadora">
      <div class="top">
        <div class="title">Calculadora</div>
        <div class="badge">HTML + CSS + JS</div>
      </div>

      <section class="display" aria-label="Display">
        <div class="expr" aria-label="Expressão" id="expr"></div>
        <div class="value" aria-label="Valor" id="value">0</div>
      </section>

      <section class="keys" aria-label="Teclado">
        <button class="btn btn--danger" type="button" data-action="clear">AC</button>
        <button class="btn btn--op" type="button" data-op="^">^</button>
        <button class="btn btn--op" type="button" data-op="%">%</button>
        <button class="btn btn--op" type="button" data-op="/">÷</button>

        <button class="btn" type="button" data-digit="7">7</button>
        <button class="btn" type="button" data-digit="8">8</button>
        <button class="btn" type="button" data-digit="9">9</button>
        <button class="btn btn--op" type="button" data-op="*">×</button>

        <button class="btn" type="button" data-digit="4">4</button>
        <button class="btn" type="button" data-digit="5">5</button>
        <button class="btn" type="button" data-digit="6">6</button>
        <button class="btn btn--op" type="button" data-op="-">−</button>

        <button class="btn" type="button" data-digit="1">1</button>
        <button class="btn" type="button" data-digit="2">2</button>
        <button class="btn" type="button" data-digit="3">3</button>
        <button class="btn btn--op" type="button" data-op="+">+</button>

        <button class="btn span-2" type="button" data-digit="0">0</button>
        <button class="btn" type="button" data-action="decimal">,</button>
        <button class="btn btn--eq" type="button" data-action="equals">=</button>
      </section>
    </main>
    <script>
      const exprEl = document.getElementById('expr');
      const valueEl = document.getElementById('value');

      const state = {
        current: '0',
        previous: null,
        op: null,
        justEvaluated: false,
      };

      function opSymbol(op) {
        if (op === '*') return '×';
        if (op === '/') return '÷';
        return op ?? '';
      }

      function formatNumberDisplay(raw) {
        if (raw === '' || raw === '-') return raw;
        const normalized = raw.replace(',', '.');
        const n = Number(normalized);
        if (!Number.isFinite(n)) return 'Erro';
        const isDecimal = normalized.includes('.');
        const [intPart, decPart] = normalized.split('.');
        const intFormatted = Number(intPart).toLocaleString('pt-BR');
        if (!isDecimal) return intFormatted;
        const safeDec = (decPart ?? '').slice(0, 10);
        return safeDec.length ? `${intFormatted},${safeDec}` : `${intFormatted},`;
      }

      function getCurrentNumber() {
        if (state.current === '' || state.current === '-' || state.current === ',') return 0;
        return Number(state.current.replace(',', '.'));
      }

      function setCurrentFromNumber(n) {
        if (!Number.isFinite(n)) {
          state.current = 'Erro';
          return;
        }
        const s = String(n);
        if (s.includes('e') || s.includes('E')) {
          state.current = n.toFixed(10).replace(/\.?0+$/, '').replace('.', ',');
          return;
        }
        state.current = s.replace('.', ',');
      }

      function updateUI() {
        const prevText = state.previous === null ? '' : String(state.previous).replace('.', ',');
        const opText = opSymbol(state.op);
        exprEl.textContent = prevText && opText ? `${formatNumberDisplay(prevText)} ${opText}` : '';

        valueEl.textContent = state.current === 'Erro' ? 'Erro' : formatNumberDisplay(state.current);
      }

      function clearAll() {
        state.current = '0';
        state.previous = null;
        state.op = null;
        state.justEvaluated = false;
        updateUI();
      }

      function inputDigit(d) {
        if (state.current === 'Erro') return;
        if (state.justEvaluated) {
          state.current = '0';
          state.justEvaluated = false;
        }
        if (state.current === '0') {
          state.current = d;
        } else {
          state.current += d;
        }
        updateUI();
      }

      function inputDecimal() {
        if (state.current === 'Erro') return;
        if (state.justEvaluated) {
          state.current = '0';
          state.justEvaluated = false;
        }
        if (!state.current.includes(',')) state.current += ',';
        updateUI();
      }

      async function computeViaApi(a, op, b) {
        try {
          const res = await fetch('/api/calc', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ n1: a, n2: b, op }),
          });
          const data = await res.json();
          if (!data?.ok) return { ok: false, error: data?.error || 'Erro' };
          return { ok: true, result: data.result };
        } catch {
          return { ok: false, error: 'Inicie o servidor: dotnet run --project .\\Calculadora\\Calculadora.csproj -- --server' };
        }
      }

      async function setOperation(op) {
        if (state.current === 'Erro') return;

        const currentValue = getCurrentNumber();

        if (state.op && state.previous !== null && !state.justEvaluated) {
          const out = await computeViaApi(state.previous, state.op, currentValue);
          if (!out.ok) {
            state.current = 'Erro';
            state.previous = null;
            state.op = null;
            exprEl.textContent = out.error;
            updateUI();
            return;
          }
          state.previous = out.result;
          state.current = String(out.result).replace('.', ',');
        } else {
          state.previous = currentValue;
        }

        state.op = op;
        state.current = '0';
        state.justEvaluated = false;
        updateUI();
      }

      async function equals() {
        if (state.current === 'Erro') return;
        if (!state.op || state.previous === null) return;

        const a = state.previous;
        const b = getCurrentNumber();
        const out = await computeViaApi(a, state.op, b);
        if (!out.ok) {
          state.current = 'Erro';
          state.previous = null;
          state.op = null;
          state.justEvaluated = true;
          exprEl.textContent = out.error;
          updateUI();
          return;
        }

        state.previous = out.result;
        state.current = String(out.result).replace('.', ',');
        state.justEvaluated = true;
        updateUI();
      }

      document.querySelector('.keys').addEventListener('click', async (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;

        const digit = btn.getAttribute('data-digit');
        const op = btn.getAttribute('data-op');
        const action = btn.getAttribute('data-action');

        if (digit !== null) return inputDigit(digit);
        if (op !== null) return await setOperation(op);

        if (action === 'clear') return clearAll();
        if (action === 'decimal') return inputDecimal();
        if (action === 'equals') return await equals();
      });

      clearAll();
    </script>
  </body>
</html>
